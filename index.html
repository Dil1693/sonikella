<title>SONIKELLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff4fa3; --pink-soft:#ffb6d9; --pink-pale:#ffe4f1;
    --deep:#2a0a1c; --deep2:#4a0f32;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:'Montserrat',system-ui,sans-serif;
    color:var(--pink-pale);
    background:
      radial-gradient(circle at 20% 10%, rgba(255,79,163,.35), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,140,200,.30), transparent 50%),
      linear-gradient(160deg, var(--deep) 0%, var(--deep2) 55%, #6b1748 100%);
    display:flex;justify-content:center;padding:48px 20px 40px;
    overflow-x:hidden;
  }
  .sparkle{position:fixed;color:var(--pink-soft);opacity:.55;pointer-events:none;animation:twinkle 3.5s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.8;transform:scale(1.1)}}
  .wrap{width:100%;max-width:440px;text-align:center;position:relative;z-index:1}
  .star{font-size:22px;color:var(--pink)}
  h1{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:clamp(46px,14vw,68px);letter-spacing:.06em;line-height:1;
    margin:10px 0 8px;
    background:linear-gradient(180deg,#fff0f8 0%,var(--pink-soft) 45%,var(--pink) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(255,79,163,.25);
  }
  .tag{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--pink-soft)}
  .divider{display:flex;align-items:center;gap:12px;margin:28px auto 22px;max-width:260px;color:var(--pink)}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--pink),transparent)}
  .section-title{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--pink-soft);text-align:left;margin:26px 0 12px 12px}
  .links + .section-title{margin-top:32px}
  .links{display:flex;flex-direction:column;gap:12px;margin-top:12px}
  .links a{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px;border-radius:999px;
    text-decoration:none;color:#fff;font-weight:500;font-size:16px;letter-spacing:.02em;
    background:rgba(255,182,217,.10);
    border:1px solid rgba(255,182,217,.45);
    backdrop-filter:blur(6px);
    transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
  }
  .links a:hover,.links a:active{
    transform:translateY(-2px);
    background:linear-gradient(90deg,rgba(255,79,163,.85),rgba(255,140,200,.85));
    box-shadow:0 8px 28px rgba(255,79,163,.45);
  }
  .links a.main{
    background:linear-gradient(90deg,var(--pink),#ff8cc8);border-color:transparent;
    box-shadow:0 8px 28px rgba(255,79,163,.4);
  }
  .links .arrow{opacity:.8}
  footer{margin-top:40px;font-size:12px;letter-spacing:.2em;color:rgba(255,182,217,.6)}
</style>
</head>
